                      const lockExistingScore = hasExistingScore && !isRowUnlocked;

                      let lockRemedial = false;
                      let refScoreText = `NA: ${fmtScore(rowComp.nilaiAkhir) || "-"}`;

                      if (STATE.selectedColKey === "r1") {
                        const s1Val = tpComp.s1;
                        refScoreText = `S1: ${fmtScore(s1Val) || "-"}`;
                        if (s1Val !== null && s1Val >= mapel.kktp) lockRemedial = true;
                      } else if (STATE.selectedColKey === "r2") {
                        const s2Val = tpComp.s2;
                        refScoreText = `S2: ${fmtScore(s2Val) || "-"}`;
                        if (s2Val !== null && s2Val >= mapel.kktp) lockRemedial = true;
                      } else if (STATE.selectedColKey === "rem") {
                        const naVal = rowComp.nilaiAkhir;
                        const hasReward = STATE.reward_siswa.some(
                          (rw) => rw.idMapelKelas === mapel.id && rw.nis === st.nis && rw.targetTembak === "RAPOR"
                        );
                        refScoreText = `NA: ${fmtScore(naVal) || "-"}`;
                        if (naVal !== null && naVal >= mapel.kktp && !hasReward) {
                          lockRemedial = true;
                        }
                      }

                      return `
                        <tr>
                          <td style="text-align:left;padding-left:14px;font-weight:600">${esc(st.nama)}</td>
                          <td>
                            ${
                              hasExistingScore
                                ? `<span class="badge" style="background:#fef3c7;color:#92400e;border:1px solid #fde68a">\u{1F512} Terisi: <b>${esc(curVal)}</b></span>`
                                : `<span class="badge ${lockRemedial ? "badge-pred-A" : ""}">${esc(refScoreText)} ${lockRemedial ? "\u2714 Tuntas" : "\u2022 Kosong"}</span>`
                            }
                          </td>
                          <td>
                            ${
                              lockRemedial
                                ? `
                              <div style="font-size:11.5px;color:#15803d;font-weight:600;padding:5px 8px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px">
                                Nilai &ge; KKTP (${esc(mapel.kktp)}) \u2014 Nonaktif
                                <input type="hidden" class="score-row-input" data-nis="${esc(st.nis)}" value="${esc(curVal)}" disabled />
                              </div>
                            `
                                : lockExistingScore
                                ? `
                              <div style="display:flex;align-items:center;gap:6px">
                                <input
                                  type="number"
                                  class="input score-row-input"
                                  style="text-align:center;font-weight:700;padding:5px;background:#f1f5f9;color:#64748b;cursor:not-allowed"
                                  data-nis="${esc(st.nis)}"
                                  value="${esc(curVal)}"
                                  disabled
                                  title="Nilai sudah ada dan dikunci agar tidak tertimpa"
                                />
                                <button
                                  type="button"
                                  class="mini-act-btn"
                                  style="white-space:nowrap;padding:5px 8px"
                                  title="Buka kunci jika ingin mengubah nilai siswa ini"
                                  onclick="window.unlockSingleScoreRow(${jsArg(st.nis)})"
                                >
                                  \u{1F513} Ubah
                                </button>
                              </div>
                            `
                                : STATE.inputMode === "copypaste"
                                ? `
                              <input
                                type="number"
                                min="0"
                                max="100"
                                step="any"
                                class="input score-row-input"
                                style="text-align:center;font-weight:700;padding:5px"
                                data-nis="${esc(st.nis)}"
                                value="${esc(curVal)}"
                                placeholder="0-100"
                                onpaste="window.handleExcelColumnPaste(event, ${idx})"
                              />
                            `
                                : `
                              <select class="input score-row-input" style="text-align:center;font-weight:700;padding:5px" data-nis="${esc(st.nis)}">
                                <option value="">-- Kosong --</option>
                                ${selectScores
                                  .map(
                                    (num) =>
                                      `<option value="${num}" ${String(curVal) === String(num) ? "selected" : ""}>${num}</option>`
                                  )
                                  .join("")}
                                ${
                                  curVal !== "" && !selectScores.includes(Number(curVal))
                                    ? `<option value="${esc(curVal)}" selected>${esc(curVal)}</option>`
                                    : ""
                                }
                              </select>
                            `
                            }
                          </td>
                        </tr>
                      `;
                    })
                    .join("")}
                </tbody>
              </table>
            </div>

            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px">
              <button type="button" class="btn btn-primary" onclick="window.saveColumnScores()">Simpan & Kirim Nilai</button>
            </div>
          </div>
        </div>
      `;
    }

                                    </div>

                                    : ""
                                }
                              </div>

                      : `<p style="color:var(--text-muted);font-size:12px">Belum ada siswa di kelas ini.</p>`

                  <label>Masukkan ke Tujuan Pembelajaran (TP)</label>
                  <select name="tpTarget" class="input" onchange="window.onGroupTargetTPChange(this.value)">
                    ${inputtedTPKeys
                      .map((k) => `<option value="${k}" ${k === activeGroupTP ? "selected" : ""}>${k} ${mapel.daftarTP?.[k] ? "\u2014 " + esc(mapel.daftarTP[k]) : ""}</option>`)

                        ${!col.isFilled && col.key === firstAvailableCol ? "selected" : ""}

                      )
                      .join("")}
                  </select>
                </div>
              </div>
              <div style="font-size:11px;color:var(--text-muted);margin-bottom:12px">
                \u{1F512} <i>Kolom Formatif/Sumatif yang sudah memiliki nilai otomatis dinonaktifkan (disabled) agar tidak menimpa nilai yang sudah ada.</i>

          <div class="card">

            ${

                    ${groups
                      .map((g) => {
                        const aspekBadges = (g.aspekList || [])

                          .join(" ");

                                ${inputtedTPKeys.map((k) => `<option value="${k}" ${curTpRe === k ? "selected" : ""}>${k}</option>`).join("")}

                                  )
                                  .join("")}
                              </select>
                              <button type="button" class="btn btn-primary" style="padding:4px 10px;font-size:11.5px" onclick="window.reapplySavedGroup(${jsArg(g.id)})">
                                Salurkan ke Kolom Kosong
                              </button>
                              <button type="button" class="btn btn-danger" style="padding:4px 10px;font-size:11.5px;margin-left:auto" onclick="window.handleDeleteGroup(${jsArg(g.id)})">
                                Hapus
                              </button>
                            </div>
                          </div>
                        `;
                      })
                      .join("")}
                  </div>`
                : `<p style="color:var(--text-secondary);font-size:12.5px">Belum ada kelompok yang dinilai pada kelas ini.</p>`
            }
          </div>
        </div>
      `;

    function renderRewardView() {
      const mapel = getActiveMapel();
      if (!mapel) return renderRekapUtamaView();

      const inputtedTPKeys = getInputtedTPKeys(mapel);
      const categories = mapel.kategoriPrestasi || DEFAULT_PRESTASI_CATEGORIES;
      let activeCat = categories.find((c) => c.id === STATE.selectedRewardCatId);
      if (!activeCat) {
        activeCat = categories[0];
        STATE.selectedRewardCatId = activeCat?.id || "";
      }

      const activeCatMedals = activeCat?.medalTiers || {
        emas: 98,
        perak: 95,
        perunggu: 92,
        harapan: 89,
        proses: 86
      };

      const selectedMedalKey = STATE.selectedRewardMedalKey || "emas";
      const autoMedalScore = activeCatMedals[selectedMedalKey] ?? 98;

      const students = STATE.murid
        .filter((m) => m.kelas === mapel.kodeKelas && m.status !== "Nonaktif")
        .sort((a, b) => a.nama.localeCompare(b.nama, "id"));

      if (!STATE.selectedRewardTargetTP || !inputtedTPKeys.includes(STATE.selectedRewardTargetTP)) {
        STATE.selectedRewardTargetTP = inputtedTPKeys[0] || "TP1";
      }

      const targetNisForCheck = STATE.selectedRewardStudentNis ? [STATE.selectedRewardStudentNis] : [];
      const rewardDailyCols = [
        { key: "remTp", label: "REM TP (Nilai Akhir TP)" },
        { key: "f1", label: "Formatif 1 (F1)" },
        { key: "f2", label: "Formatif 2 (F2)" },
        { key: "f3", label: "Formatif 3 (F3)" },
        { key: "f4", label: "Formatif 4 (F4)" },
        { key: "f5", label: "Formatif 5 (F5)" },
        { key: "s1", label: "Sumatif 1 (S1)" },
        { key: "s2", label: "Sumatif 2 (S2)" }
      ].map((c) => {
        const info = getColumnFilledInfo(mapel, "TP", c.key, STATE.selectedRewardTargetTP, targetNisForCheck);
        return { ...c, isFilled: info.isFilled };
      });

      const firstOpenDailyCol = rewardDailyCols.find((c) => !c.isFilled)?.key || "";

      const allRewardsInMapel = STATE.reward_siswa.filter((r) => r.idMapelKelas === mapel.id);
      const filteredRewards = allRewardsInMapel.filter(
        (r) => !STATE.rewardFilterNis || r.nis === STATE.rewardFilterNis
      );

      const awardsByStudentMap = {};
      filteredRewards.forEach((r) => {
        if (!awardsByStudentMap[r.nis]) {
          const stObj = STATE.murid.find((m) => m.nis === r.nis);
          awardsByStudentMap[r.nis] = {
            nis: r.nis,
            namaMurid: stObj ? stObj.nama : r.namaMurid,
            kelas: stObj ? stObj.kelas : mapel.kodeKelas,
            awards: []
          };
        }
        awardsByStudentMap[r.nis].awards.push(r);
      });
      const awardedStudentsList = Object.values(awardsByStudentMap).sort((a, b) =>
        a.namaMurid.localeCompare(b.namaMurid, "id")
      );

      return `
        ${renderCleanWorkspaceBar(mapel, "Penghargaan & Prestasi Siswa")}

        <details class="adv-box" ${STATE.rwAdvOpen ? "open" : ""} ontoggle="window.setRwAdv(this.open)">
          <summary>\u2699\uFE0F Pengaturan ajang & poin medali (opsional \u2014 buka jika perlu)</summary>

        <div class="card">
          <div class="card-head">
            <h3>Kategori Ajang / Prestasi</h3>
            <span class="badge" style="background:var(--primary-soft);color:var(--primary)">
              Ajang Terpilih: ${esc(activeCat ? activeCat.kode : "-")}
            </span>
          </div>

          <p style="font-size:12px;color:var(--text-secondary);margin-bottom:10px">
            Klik salah satu <b>Kategori Ajang / Kompetisi</b> di bawah ini untuk memunculkan dan mengatur <b>Standar Poin Peringkat / Medali</b> pada Tahap 2:
          </p>

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:8px;margin-bottom:14px">
            ${categories
              .map((c) => {
                const isSelected = activeCat && c.id === activeCat.id;
                return `
                  <div
                    onclick="window.selectRewardCategory(${jsArg(c.id)})"
                    style="cursor:pointer;padding:10px 12px;border-radius:8px;border:2px solid ${
                      isSelected ? "var(--primary)" : "var(--border-soft)"
                    };background:${isSelected ? "var(--primary-soft)" : "var(--bg-subtle)"};display:flex;justify-content:space-between;align-items:flex-start;gap:8px;transition:all 0.15s"

      const ta = getCurrentTA();
      return !!ta && ta["sem" + String(sem).slice(-1)] === "aktif";

      e.preventDefault();
      const v = String(e.target.namaMapel.value || "").trim().replace(/\s+/g, " ");
      if (!v) return showToast("Tulis nama mata pelajaran dulu.");
      if (v.length > 80) return showToast("Nama mata pelajaran maksimal 80 karakter.");
      STATE.tpWizard = { namaMapel: v, semester: "" };
      renderApp();
    };

    window.tpWizardSetSemester = function (sem) {
      if (!isSemesterActive(sem)) return showToast("Semester itu belum aktif atau sudah berakhir.");
      STATE.tpWizard = { ...(STATE.tpWizard || {}), semester: sem };
      renderApp();
    };

    window.tpWizardReset = function () {
      STATE.tpWizard = { namaMapel: "", semester: "" };
      renderApp();
    };

    function renderTPWizard() {
      const w = STATE.tpWizard || {};
      const ta = getCurrentTA();
      const semBtn = (sem, label) => {
        const st = ta ? ta["sem" + sem.slice(-1)] : "belum";
        const on = st === "aktif";
        const why = st === "selesai" ? "Semester sudah berakhir" : "Semester belum diaktifkan";
        return `<button type="button" class="sem-pick ${w.semester === sem ? "on" : ""}" ${on ? "" : "disabled"} title="${on ? "" : why}" onclick="window.tpWizardSetSemester(${jsArg(sem)})">${on ? "" : "\u{1F512} "}${label}</button>`;
      };
      const step1 = w.namaMapel
        ? `<div class="wiz-done"><b>${esc(w.namaMapel)}</b><button type="button" class="btn" style="padding:3px 9px;font-size:11px" onclick="window.tpWizardReset()">Ganti</button></div>`
        : `<form class="wiz-row" onsubmit="window.tpWizardSetMapel(event)"><input name="namaMapel" class="input" placeholder="Contoh: Informatika" maxlength="80" required /><button type="submit" class="btn btn-primary">Lanjut</button></form>`;
      const ready = !!w.semester && isSemesterActive(w.semester);
      const rest = w.namaMapel
        ? `
        <div class="wiz-head"><span class="wiz-n">2</span> Semester yang Diaktifkan</div>
        <div class="wiz-row">${semBtn("Sem 1", "Semester 1 (Ganjil)")}${semBtn("Sem 2", "Semester 2 (Genap)")}</div>

          <button type="submit" class="btn btn-primary" ${ready ? "" : "disabled"}>+ Simpan Kelas & Mapel</button>
        </form>`
        : "";
      return `<div class="wiz-head"><span class="wiz-n">1</span> Mata Pelajaran</div>${step1}${rest}`;

    function isMenuLocked(id) {
      if (id === "backup_ta") return false;
      const ta = getCurrentTA();
      if (!(ta && ta.sem1 !== "belum")) return true;
      if (id === "murid" && !STATE.pengaturan_mapel.length) return true;
      return false;
    }

    function menuLockReason(id) {
      const ta = getCurrentTA();
      if (!(ta && ta.sem1 !== "belum")) return "Menu terkunci. Buat tahun ajaran dan aktifkan Semester 1 dulu di Backup & Tahun Ajaran.";
      if (id === "murid") return "Data Murid aktif setelah kelas dibuat di menu TP & Kelas Mapel.";
      return "Menu terkunci.";
    }

    function canCreateNewTA() {
      const ta = getCurrentTA();
      if (!ta) return { ok: true };
      if (ta.sem2 !== "selesai") return { ok: false, why: "Tahun ajaran baru bisa dibuat setelah Semester 1 dan Semester 2 selesai." };
      if (!ta.backupAt) return { ok: false, why: "Unduh Backup JSON terlebih dahulu (tombol di kartu Backup & Pulihkan JSON)." };
      return { ok: true };
    }

    function getCurrentTA() {
      const l = (STATE.tahun_ajaran || []).slice().sort((a, b) => String(a.nama).localeCompare(String(b.nama)));
      return l.length ? l[l.length - 1] : null;
    }

    function canEndSemester(n) {
      const notDone = STATE.pengaturan_mapel.filter((m) => m.semester === "Sem " + n && !isSemesterDone(m));
      return { ok: notDone.length === 0, notDone };
    }

    function selectMapelOfSemester(sem) {
      const cur = getActiveMapel();
      const list = STATE.pengaturan_mapel.filter((m) => m.semester === sem);
      const pick = list.find((m) => cur && m.kodeKelas === cur.kodeKelas && m.namaMapel === cur.namaMapel) || list[0];
      if (pick) STATE.selectedMapelId = pick.id;
    }

    window.handleCreateTA = async function (e) {
      e.preventDefault();
      const f = e.target;
      const chk0 = canCreateNewTA();
      if (!chk0.ok) return showToast(chk0.why);
      const m = /^(\d{4})\s*\/\s*(\d{4})$/.exec(f.namaTA.value.trim());
      if (!m || Number(m[2]) !== Number(m[1]) + 1) return showToast("Format tahun ajaran: 2026/2027 (tahun kedua = tahun pertama + 1).");
      const nama = `${m[1]}/${m[2]}`;
      if ((STATE.tahun_ajaran || []).some((t) => t.nama === nama)) return showToast("Tahun ajaran itu sudah ada.");
      await saveDocument("tahun_ajaran", "ta_" + m[1] + "_" + m[2], { nama, sem1: "belum", sem2: "belum", dibuat: new Date().toISOString() });
      f.reset();
      showToast(`Tahun ajaran ${nama} dibuat. Silakan aktifkan Semester 1.`);
      renderApp();
    };

    window.activateSemester = async function (n) {
      const ta = getCurrentTA();
      if (!ta) return;
      if (n === 1 && ta.sem1 !== "belum") return;
      if (n === 2 && (ta.sem1 !== "selesai" || ta.sem2 !== "belum")) return showToast("Semester 2 baru bisa diaktifkan setelah Semester 1 berakhir.");
      await saveDocument("tahun_ajaran", ta.id, { ...ta, ["sem" + n]: "aktif" });
      if (n === 2) {
        for (const m of [...STATE.pengaturan_mapel.filter((x) => x.semester === "Sem 1")]) {
          if (STATE.pengaturan_mapel.some((x) => x.semester === "Sem 2" && x.kodeKelas === m.kodeKelas && x.namaMapel === m.namaMapel)) continue;
          const id = `Sem 2_${m.kodeKelas}_${m.namaMapel}`.toLowerCase().replace(/[^a-z0-9]+/g, "_");
          const c = JSON.parse(JSON.stringify(m));
          c.id = id;
          c.semester = "Sem 2";
          c.daftarTP = createEmptyTPMap(Number(m.jumlahTP || 10));
          await saveDocument("pengaturan_mapel", id, c);
        }
      }
      selectMapelOfSemester("Sem " + n);
      showToast(`Semester ${n} diaktifkan.`);
      renderApp();
    };

    window.endSemester = async function (n) {
      const ta = getCurrentTA();
      if (!ta || ta["sem" + n] !== "aktif") return;
      const chk = canEndSemester(n);
      if (!chk.ok) return showToast(`Belum bisa mengakhiri Semester ${n}: ATS & SAT belum lengkap di ${chk.notDone.length} kelas/mapel.`);
      showToast("Memeriksa sinkronisasi database...");
      const vs = await verifySync();
      if (!vs.ok) return showToast(`Semester ${n} belum bisa diakhiri: ${vs.why}`);
      await saveDocument("tahun_ajaran", ta.id, { ...ta, ["sem" + n]: "selesai" });
      showToast(`Semester ${n} diakhiri.${vs.preview ? "" : " Data terverifikasi di database (" + vs.checked + " dokumen)."}${n === 1 ? " Semester 2 kini bisa diaktifkan." : ""}`);
      renderApp();
    };

    function renderTahunAjaranCard() {
      const ta = getCurrentTA();
      const chk = canCreateNewTA();
      const nextStep = !ta ? "Buat tahun ajaran."
        : ta.sem1 === "belum" ? "Aktifkan Semester 1."

    window.exportJSON = async function () {
      const ta = getCurrentTA();
      if (ta && ta.sem2 === "selesai" && !ta.backupAt) {
        try {
          await saveDocument("tahun_ajaran", ta.id, { ...ta, backupAt: new Date().toISOString() });
        } catch (err) {}
      }
      const payload = { app: "blokkod3-assesment", version: 1, exportedAt: new Date().toISOString(), collections: {} };
      COLLECTIONS.forEach((c) => { payload.collections[c] = STATE[c] || []; });
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `blokkod3-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      showToast("Backup JSON diunduh.");
      renderApp();
    };

    window.importJSON = async function (e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        const obj = JSON.parse(await file.text());
        if (!obj || obj.app !== "blokkod3-assesment" || !obj.collections) throw new Error("Berkas ini bukan backup blokkod3.");
        if (file.size > 20 * 1024 * 1024) throw new Error("Berkas terlalu besar (maks 20 MB).");
        const badKey = (o, depth = 0) => {
          if (!o || typeof o !== "object" || depth > 12) return false;
          if (Object.prototype.hasOwnProperty.call(o, "__proto__") || Object.prototype.hasOwnProperty.call(o, "constructor")) return true;
          return Object.values(o).some((v) => badKey(v, depth + 1));
        };
        for (const col of COLLECTIONS) {
          const arr = obj.collections[col] || [];
          if (!Array.isArray(arr)) throw new Error(`Data ${col} tidak valid.`);
          for (const d of arr) {
            if (!d || typeof d !== "object" || Array.isArray(d) || typeof d.id !== "string" || !d.id || d.id.length > 190 || badKey(d)) {
              throw new Error(`Ada data tidak valid pada ${col}. Pemulihan dibatalkan.`);
            }
          }
        }
        let n = 0;
        for (const col of COLLECTIONS) {
          const arr = obj.collections[col] || [];
          if (arr.length) {
            await saveDocuments(col, arr);
            n += arr.length;
          }
        }
        showToast(`${n} data berhasil dipulihkan.`);
        renderApp();
      } catch (err) {
        showToast("Gagal memulihkan: " + (err.message || err));
      }
      e.target.value = "";
    };

      applyGuiTheme(prof.temaGui || "default");

      if (!STATE.user && STATE.booting) {
        root.innerHTML = `<div class="login-screen"><div style="text-align:center;color:var(--text-secondary);font-weight:600">Memuat sesi & data dari database...</div></div>`;
        return;
      }

      if (!STATE.user) {
        root.innerHTML = renderLoginScreen();
        return;
      }

      const initials = (prof.namaGuru || "G").split(" ").map((w) => w[0]).join("").slice(0, 2).toUpperCase();
      const activeThemeKey = prof.temaGui || "default";

      const navGroups = [
        {
          title: "Penilaian Utama",
          items: [
            { id: "beranda", label: "\u{1F3E0} Beranda" },
            { id: "rekap", label: "Rekap Leger Rapor" },
            { id: "detail_tp", label: "Rincian Per TP" },
            { id: "perbandingan", label: "Perbandingan Sem 1 & 2" },
            { id: "kelompok", label: "Kerja Kelompok" },
            { id: "reward", label: "Penghargaan Siswa" },
            { id: "reminder", label: "Pengingat WA & Email" }
          ]
        },
        {
          title: "Data & Konfigurasi",
          items: [
            { id: "tp_mapel", label: "TP & Kelas Mapel" },
            { id: "murid", label: "Data Murid & XLS" },
            { id: "bobot", label: "Bobot & Konversi" },
            { id: "backup_ta", label: "Backup & Tahun Ajaran" },
            { id: "profil", label: "Profil Guru" },
            { id: "akses", label: "Panduan & Tema GUI" }
          ]
        }
      ];

      let mainViewHTML = "";
      if (STATE.activeMenu === "beranda") mainViewHTML = renderBerandaView();
      else if (STATE.activeMenu === "rekap") mainViewHTML = renderRekapUtamaView();
      else if (STATE.activeMenu === "detail_tp") mainViewHTML = renderDetailTPView();
      else if (STATE.activeMenu === "perbandingan") mainViewHTML = renderPerbandinganSemesterView();
      else if (STATE.activeMenu === "input_kolom") mainViewHTML = renderInputKolomView();
      else if (STATE.activeMenu === "kelompok") mainViewHTML = renderKelompokView();
      else if (STATE.activeMenu === "reward") mainViewHTML = renderRewardView();
      else if (STATE.activeMenu === "reminder") mainViewHTML = renderReminderView();
      else if (STATE.activeMenu === "tp_mapel") mainViewHTML = renderTPMapelView();
      else if (STATE.activeMenu === "murid") mainViewHTML = renderMuridView();
      else if (STATE.activeMenu === "bobot") mainViewHTML = renderBobotView();
      else if (STATE.activeMenu === "backup_ta") mainViewHTML = renderBackupTahunAjaranView();
      else if (STATE.activeMenu === "profil") mainViewHTML = renderProfilGuruView();
      else if (STATE.activeMenu === "akses") mainViewHTML = renderAksesTutorialView();

      root.innerHTML = `
        ${
          IS_PREVIEW
            ? `
          <div class="preview-banner">
            <div><span class="preview-badge">PREVIEW</span> Mode uji coba interaktif aktif.</div>
            <div style="display:flex;align-items:center;gap:14px">
              <a href="https://lynk.id/blokkode" target="_blank" rel="noopener noreferrer" style="color:#5eead4;text-decoration:none;font-weight:600">
                lynk.id/blokkode &nearr;
              </a>
              <span>Guru: <b>${esc(prof.namaGuru)}</b></span>
            </div>
          </div>
        `
            : ""
        }
        <div class="app-shell">
          <aside class="sidebar">
            <div class="brand-box">
              <div class="blokkod-logo-wrap">
                ${getBlokkodLogoSVG()}
              </div>
              <div class="brand-title-stack">
                <div class="brand-title-shimmer">blokkod3</div>
                <div class="brand-subtitle-line">ASSESMENT</div>
              </div>
            </div>

            <div class="teacher-side-card" onclick="window.navigateMenu('profil')" title="Pengaturan Profil Guru">
              <div class="teacher-avatar">
                ${prof.fotoBase64 ? `<img src="${esc(prof.fotoBase64)}" alt="Guru" />` : initials}
              </div>
              <div style="overflow:hidden">
                <div style="font-size:12px;font-weight:600;color:#f8fafc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(prof.namaGuru)}</div>
                <div style="font-size:10.5px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(prof.namaSekolah)}</div>
              </div>
            </div>

            <div class="theme-swatch-bar" title="Ganti Warna Tampilan GUI">
              <span style="font-size:10.5px;color:#94a3b8;font-weight:600">Warna GUI:</span>
              <div style="display:flex;gap:5px;align-items:center">
                ${Object.entries(GUI_THEMES)
                  .map(
                    ([k, t]) => `
                  <button
                    type="button"
                    class="theme-dot-btn ${activeThemeKey === k ? "active" : ""}"
                    style="background:${t.dotColor}"
                    title="${esc(t.label)}"
                    onclick="window.changeGuiTheme(${jsArg(k)})"
                  ></button>
                `
                  )
                  .join("")}
              </div>
            </div>

            <div class="nav-list">
              ${navGroups
                .map(
                  (grp) => `
                <div class="nav-section-label">${grp.title}</div>
                ${grp.items
                  .map(
                    (m) => `
                  <button
                    type="button"
                    ${isMenuLocked(m.id) ? "disabled" : ""}
                    class="nav-btn ${STATE.activeMenu === m.id || (STATE.activeMenu === "input_kolom" && m.id === "detail_tp") ? "active" : ""}"
                    onclick="window.navigateMenu(${jsArg(m.id)})"
                  >
                    <span class="nav-dot"></span>
                    <span>${isMenuLocked(m.id) ? "\u{1F512} " : ""}${m.label}</span>
                  </button>
                `
                  )
                  .join("")}
              `
                )
                .join("")}
            </div>

            <div class="sidebar-footer">
              <a href="https://lynk.id/blokkode" target="_blank" rel="noopener noreferrer" class="promo-link" title="Lihat produk aplikasi sekolah lainnya">
                <span>Produk Lainnya</span>
                <b style="color:#5eead4">lynk.id/blokkode &nearr;</b>
              </a>
              <button type="button" class="btn btn-danger" style="width:100%;padding:6px" onclick="window.handleLogout()">
                Keluar Sesi
              </button>
            </div>
          </aside>

          <main class="main-content">
            ${mainViewHTML}
          </main>

          <nav class="bottom-nav">
            ${[
              { id: "beranda", label: "Beranda" },
              { id: "rekap", label: "Rekap" },
              { id: "detail_tp", label: "Rincian TP" },
              { id: "perbandingan", label: "Sem 1 vs 2" },
              { id: "kelompok", label: "Kelompok" },
              { id: "akses", label: "Tema GUI" }
            ]
              .map(
                (m) => `
              <button
                type="button"
                ${isMenuLocked(m.id) ? "disabled" : ""}
                class="bnav-btn ${STATE.activeMenu === m.id ? "active" : ""}"
                onclick="window.navigateMenu(${jsArg(m.id)})"
              >
                <span>${m.label}</span>
              </button>
            `
              )
              .join("")}
          </nav>
        </div>
      `;
    }

    // Pulihkan sesi Supabase yang masih berlaku saat halaman dibuka (tanpa login ulang)
    async function bootSession() {
      if (IS_PREVIEW) return;
      try {
        await DB.init();
        if (typeof DB.auth.onSignedOut === "function") {
          DB.auth.onSignedOut(() => {
            if (STATE.user && !STATE.loggingOut) {
              STATE.user = null;
              showToast("Sesi berakhir. Silakan masuk lagi.");
              renderApp();
            }
          });
        }
        const cred = typeof DB.auth.restore === "function" ? await DB.auth.restore() : null;
        if (cred) {
          restorePending();
          await flushPending();
          await loadAllData();
          applyPendingToState();
          STATE.user = {
            identitas: cred.email,
            nama: getTeacherProfile().namaGuru || cred.email,
            role: "Admin",
            aksesKelas: "Semua"
          };
        }
      } catch (err) {
        showToast("Gagal memuat data: " + (err.message || err));
      } finally {
        STATE.booting = false;
        renderApp();
      }
    }

    renderApp();
    bootSession();
  </script>
</body>
</html>
