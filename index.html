  <style>
    /* Palet Warna Ergonomis & Nyaman di Mata (Default: Calm Sage & Slate) */
    :root {
      --bg-app: #f3f5f7;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --bg-muted: #eef2f6;
      --sidebar-bg: #111827;
      --sidebar-hover: #1f2937;
      --sidebar-active: #0f766e;
      --sidebar-text: #cbd5e1;
      --text-main: #1e293b;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border-soft: #dce3ec;
      --border-strong: #cbd5e1;
      --primary: #0f766e;
      --primary-hover: #115e59;
      --primary-soft: #f0fdfa;
      --accent-slate: #334155;
      --accent-amber: #b45309;
      --accent-amber-soft: #fef3c7;
      --danger: #b91c1c;

      --success: #15803d;

    * {

      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-app);
      color: var(--text-main);
      font-size: 13.5px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    #app-root {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-app);
      z-index: 99999;
      display: flex;
      flex-direction: column;
    }

    .app-shell {
      display: flex;
      flex: 1;
      height: 100%;
      overflow: hidden;
    }

    /* Sidebar Kiri Profesional */
    aside.sidebar {
      width: 256px;
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      flex-shrink: 0;
      z-index: 20;
      border-right: 1px solid #1e293b;
      transition: background 0.25s ease;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 12px;
    }

    /* Logo blokkod3 dengan Efek Cahaya Berjalan (Moving Light Sweep) */
    .blokkod-logo-wrap {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #091315;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(0, 245, 223, 0.38), 0 4px 14px rgba(0, 0, 0, 0.45);
    }

    .blokkod-logo-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .blokkod-logo-wrap::after {
      content: "";
      position: absolute;
      top: -60%;
      left: -130%;
      width: 75%;
      height: 220%;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.58) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(28deg);
      animation: lightSweepLogo 3.2s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes lightSweepLogo {
      0% { left: -130%; }
      45%, 100% { left: 160%; }
    }

    /* Judul Aplikasi 2 Baris Elegan dengan Efek Cahaya Berjalan */
    .brand-title-stack {
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.1;
    }

    .brand-title-shimmer {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 18px;
      font-weight: 800;
      font-style: italic;
      letter-spacing: -0.4px;
      background: linear-gradient(90deg, #ffffff 0%, #6fe3e1 35%, #f472b6 55%, #ffffff 75%, #ffffff 100%);
      background-size: 220% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textLightFlow 5s linear infinite;
    }

    .brand-subtitle-line {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2.8px;
      text-transform: uppercase;
      color: #5eead4;
      margin-top: 3px;
      display: inline-block;
    }

    @keyframes textLightFlow {
      0% { background-position: 0% center; }
      100% { background-position: 220% center; }
    }

    /* Profil Singkat Guru di Sidebar */
    .teacher-side-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      padding: 9px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .teacher-side-card:hover {
      background: rgba(255, 255, 255, 0.09);
    }

    .teacher-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;

      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .teacher-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Swatch Pemilih Warna GUI di Sidebar */
    .theme-swatch-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .theme-dot-btn {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      padding: 0;
    }

    .theme-dot-btn:hover {
      transform: scale(1.18);
    }

    .theme-dot-btn.active {
      border-color: #ffffff;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35);
      transform: scale(1.14);
    }

    .nav-section-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: #94a3b8;
      padding: 8px 10px 4px;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      overflow-y: auto;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 11px;
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      color: var(--sidebar-text);
      font-family: inherit;
      font-size: 12.8px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      background: var(--sidebar-hover);
      color: #ffffff;
    }

    .nav-btn.active {
      background: var(--sidebar-active);
      color: #ffffff;
      font-weight: 600;
    }

    .nav-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #64748b;
      flex-shrink: 0;
    }

    .nav-btn.active .nav-dot {
      background: #5eead4;
    }

    .sidebar-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 10px;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .promo-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      font-size: 11px;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      transition: all 0.15s;
    }

    .promo-link:hover {
      color: #5eead4;
      border-color: rgba(94, 234, 212, 0.35);
      background: rgba(255, 255, 255, 0.07);
    }

    /* Konten Utama */
    main.main-content {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      padding: 18px 22px 90px;
      background: var(--bg-app);
    }

    /* Bottom Navigation Bar (Mobile) */
    nav.bottom-nav {
      display: none;
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(17, 24, 39, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 6px;
      z-index: 50;
      justify-content: space-around;
      align-items: center;
    }

    .bnav-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 6px 2px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: #94a3b8;
      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .bnav-btn.active {
      color: #fff;
      background: var(--primary);
    }

    .nav-list { gap: 1px; overflow-y: auto; scrollbar-width: none; }
    .nav-list::-webkit-scrollbar { display: none; }
    .nav-btn { padding: clamp(2px, 0.75vh, 8px) 11px; font-size: clamp(11px, 1.55vh, 12.8px); }
    .nav-section-label { padding: clamp(3px, 0.8vh, 8px) 10px 2px; }
    .teacher-side-card { padding: 6px 10px; margin-bottom: 6px; }
    .theme-swatch-bar { padding: 4px 10px; margin-bottom: 4px; }
    .ws-field { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--text-secondary); }
    .ws-field select { width: auto; font-weight: 700; padding: 5px 10px; }
    .fx-card { background: var(--bg-card); border: 1px solid var(--border-soft); border-left: 4px solid var(--primary); border-radius: var(--radius-md); padding: 10px 14px; margin-bottom: 12px; }
    .fx-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .fx-head .btn { margin-left: auto; padding: 4px 10px; font-size: 11px; }
    .fx-model { background: var(--primary-soft); color: var(--primary); font-weight: 700; font-size: 11px; padding: 2px 9px; border-radius: 99px; }
    .fx-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .fx-chip { display: inline-flex; align-items: baseline; gap: 6px; background: var(--bg-subtle); border: 1px solid var(--border-soft); border-radius: 8px; padding: 3px 9px; font-size: 12px; }
    .fx-chip small { color: var(--text-secondary); font-size: 10.5px; font-weight: 600; }
    .fx-more summary { cursor: pointer; font-size: 11.5px; color: var(--text-secondary); }
    .fx-more p { font-size: 11.5px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }
    .dash-hero { position: relative; overflow: hidden; border-radius: 18px; padding: 22px 24px; margin-bottom: 14px; color: #fff; background: linear-gradient(135deg, var(--primary), #0ea5e9 130%); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .dash-hero h2 { font-size: clamp(18px, 3vw, 26px); margin: 0 0 4px; }
    .dash-hero p { margin: 0; opacity: .9; font-size: 13px; }
    .dash-hero svg { flex-shrink: 0; width: clamp(90px, 18vw, 170px); height: auto; opacity: .95; }
    .dash-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .dash-kpi { background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow-card); }
    .dash-kpi small { display: block; color: var(--text-secondary); font-size: 11.5px; font-weight: 600; }
    .dash-kpi b { font-size: 24px; color: var(--text-main); }
    .dash-kpi span { font-size: 11px; color: var(--text-secondary); margin-left: 4px; }
    .dash-grid { display: grid; grid-template-columns: 1fr 1.6fr 1fr; gap: 12px; margin-bottom: 14px; }
    .dash-card { background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: 14px; padding: 14px; box-shadow: var(--shadow-card); min-width: 0; }
    .dash-card h4 { margin: 0 0 8px; font-size: 13px; color: var(--text-main); }
    .dash-card svg { width: 100%; height: auto; color: var(--text-secondary); }
    .dash-legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; font-size: 11px; color: var(--text-secondary); }
    .dash-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; }
    .dash-rank { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 7px; }
    .dash-rank .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dash-rank .bar { width: 70px; height: 6px; background: var(--bg-subtle); border-radius: 9px; overflow: hidden; }
    .dash-rank .bar i { display: block; height: 100%; background: var(--primary); }
    .dash-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .dash-tile { border: 0; cursor: pointer; text-align: left; color: #fff; background: var(--g); border-radius: 16px; padding: 14px; min-height: 96px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; position: relative; overflow: hidden; font-family: inherit; transition: transform .15s; }
    .dash-tile:hover { transform: translateY(-3px); }
    .dash-tile .ic { position: absolute; top: 8px; right: 12px; font-size: 34px; opacity: .85; }
    .dash-tile b { font-size: 13.5px; }
    .dash-tile small { font-size: 11px; opacity: .9; }
    @media (max-width: 900px) { .dash-grid { grid-template-columns: 1fr; } }
    .btn[disabled], .nav-btn[disabled], .bnav-btn[disabled] { opacity: .4; cursor: not-allowed; }
    .card-head { row-gap: 6px; }
    .card-head h3 { flex: 1 1 auto; min-width: 0; text-wrap: balance; }
    .workspace-title { flex: 1 1 auto; min-width: 0; }
    .wiz-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; margin: 14px 0 6px; }
    .wiz-n { width: 22px; height: 22px; border-radius: 50%; background: var(--primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
    .wiz-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .wiz-row .input { flex: 1 1 180px; }
    .wiz-done { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--primary-soft); color: var(--primary); border-radius: 10px; padding: 8px 12px; }
    .wiz-hint { font-size: 11.5px; color: var(--text-secondary); margin: 6px 0 2px; }
    .sem-pick { flex: 1 1 150px; padding: 10px; border-radius: 10px; border: 1px solid var(--border-soft); background: var(--bg-subtle); font-weight: 700; font-family: inherit; cursor: pointer; color: var(--text-main); }
    .sem-pick.on { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
    .sem-pick[disabled] { opacity: .55; cursor: not-allowed; }
    html { -webkit-text-size-adjust: 100%; }
    #app-root { box-sizing: border-box; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
    input, select, textarea { font-size: 16px; }
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    #sys-tools { position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 100000; display: flex; gap: 8px; }
    #sync-pill { align-self: center; font-size: 11px; font-weight: 700; padding: 6px 11px; border-radius: 99px; background: var(--bg-card, #fff); border: 1px solid var(--border-soft, #e2e8f0); color: var(--text-secondary, #475569); box-shadow: 0 2px 8px rgba(0,0,0,.15); white-space: nowrap; }

    #sync-banner { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 100001; background: #dc2626; color: #fff; font-size: 12.5px; font-weight: 600; text-align: center; padding: 7px 12px; display: none; }
    #sys-tools button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border-soft, #e2e8f0); background: var(--primary, #0f766e); color: #fff; font-size: 17px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.25); opacity: .9; }

    const KEY_COLS = {
      tahun_ajaran: { nama: "nama", sem1: "sem1", sem2: "sem2" },
      pengaturan_mapel: { semester: "semester", kodeKelas: "kode_kelas", namaMapel: "nama_mapel" },

    };

    function toRow(col, id, obj) {
      const row = { id, data: obj };
      const map = KEY_COLS[col] || {};
      Object.keys(map).forEach((k) => {
        const v = obj[k];
        row[map[k]] = v === undefined || v === null || v === "" ? null : String(v);
      });
      return row;
    }

    function fromRow(r) {
      let d = r.data;
      if (typeof d === "string") {
        try { d = JSON.parse(d); } catch (e) { d = {}; }
      }
      return { ...(d || {}), id: r.id };
    }

    function createSupabaseDriver() {
      let client = null;
      // Pesan error yang mudah dipahami (tabel belum dibuat / RLS menolak / sesi habis)
      function sbError(col, error) {
        const msg = String((error && error.message) || error || "");
        const code = String((error && error.code) || "");
        if (code === "42P01" || code === "PGRST205" || /does not exist|schema cache/i.test(msg)) {
          return new Error(`Tabel "${col}" belum dibuat di Supabase. Jalankan file supabase_schema.sql di SQL Editor.`);
        }
        if (code === "42501" || /row-level security|permission denied/i.test(msg)) {
          return new Error(`Akses ke tabel "${col}" ditolak (RLS). Pastikan sudah masuk dan kebijakan RLS dari supabase_schema.sql sudah dijalankan.`);
        }
        if (code === "PGRST301" || /JWT/i.test(msg)) {
          return new Error("Sesi masuk sudah habis. Silakan masuk ulang.");
        }
        return new Error(`${col}: ${msg}`);
      }
      return {
        name: "supabase",
        async init() {
          if (client) return;
          if (/ANDA/.test(SUPABASE_URL) || /ANDA/.test(SUPABASE_ANON_KEY)) {
            throw new Error("Isi SUPABASE_URL dan SUPABASE_ANON_KEY terlebih dahulu.");
          }
          const mod = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
          client = mod.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
          });
        },
        async list(col) {
          const out = [];
          for (let from = 0; ; from += 1000) {
            const { data, error } = await client.from(col).select("id,data").order("id").range(from, from + 999);
            if (error) throw sbError(col, error);
            out.push(...data.map(fromRow));
            if (data.length < 1000) break;
          }
          return out;
        },
        async upsert(col, id, obj) {
          const { error } = await client.from(col).upsert(toRow(col, id, obj), { onConflict: "id" });
          if (error) throw sbError(col, error);
        },
        async bulkUpsert(col, items) {
          for (let i = 0; i < items.length; i += 200) {
            const rows = items.slice(i, i + 200).map((d) => toRow(col, d.id, d));
            const { error } = await client.from(col).upsert(rows, { onConflict: "id" });
            if (error) throw sbError(col, error);
          }
        },
        async remove(col, id) {
          const { error } = await client.from(col).delete().eq("id", id);
          if (error) throw sbError(col, error);
        },
        auth: {
          async signIn(email, password) {
            const { data, error } = await client.auth.signInWithPassword({ email, password });
            if (error) throw new Error(/invalid/i.test(error.message) ? "Email atau kata sandi salah." : error.message);
            return { email: data.user.email };
          },
          // Pulihkan sesi Supabase yang tersimpan (agar tidak login ulang saat halaman dibuka lagi)
          async restore() {
            const { data, error } = await client.auth.getSession();
            if (error || !data || !data.session || !data.session.user) return null;
            return { email: data.session.user.email };
          },
          // Dipanggil bila sesi berakhir / keluar dari tab lain
          onSignedOut(cb) {
            client.auth.onAuthStateChange((event) => {
              if (event === "SIGNED_OUT") cb();
            });
          },
          async signOut() {
            await client.auth.signOut();
          },
          async changePassword(oldPass, newPass) {
            const { data: u } = await client.auth.getUser();
            const email = u && u.user && u.user.email;
            if (!email) throw new Error("Sesi habis, silakan masuk ulang.");
            const chk = await client.auth.signInWithPassword({ email, password: oldPass });
            if (chk.error) throw new Error("Kata sandi lama salah.");
            const { error } = await client.auth.updateUser({ password: newPass });
            if (error) throw new Error(error.message);
          }
        }
      };
    }

    function createFirebaseDriver() {
      let app = null, auth = null, db = null, A = null, F = null;
      return {
        name: "firebase",
        async init() {
          if (app) return;
          const M = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
          A = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
          F = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
          app = M.initializeApp(firebaseConfig);
          auth = A.getAuth(app);
          db = F.getFirestore(app);
        },
        async list(col) {
          const snap = await F.getDocs(F.collection(db, col));
          return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        },
        async upsert(col, id, obj) {
          await F.setDoc(F.doc(db, col, id), { ...obj, id }, { merge: true });
        },
        async bulkUpsert(col, items) {
          for (let i = 0; i < items.length; i += 400) {
            const batch = F.writeBatch(db);
            items.slice(i, i + 400).forEach((d) => batch.set(F.doc(db, col, d.id), { ...d }, { merge: true }));
            await batch.commit();
          }
        },
        async remove(col, id) {
          await F.deleteDoc(F.doc(db, col, id));
        },
        auth: {
          async signIn(email, password) {
            const c = await A.signInWithEmailAndPassword(auth, email, password);
            return { email: c.user.email };
          },
          async signOut() {
            await A.signOut(auth);
          },
          async changePassword(oldPass, newPass) {
            const u = auth.currentUser;
            if (!u) throw new Error("Sesi habis, silakan masuk ulang.");
            try {
              await A.reauthenticateWithCredential(u, A.EmailAuthProvider.credential(u.email, oldPass));
            } catch (e) {
              throw new Error("Kata sandi lama salah.");
            }
            await A.updatePassword(u, newPass);
          }
        }
      };
    }

    // Kontrak API untuk MySQL/PostgreSQL/lainnya (lihat PETUNJUK_PEMASANGAN.md)
    function createRestDriver() {
      let token = null;
      async function call(action, opt = {}) {
        const res = await fetch(`${REST_API_URL}?action=${action}${opt.query || ""}`, {
          method: opt.method || "POST",
          headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
          body: opt.body ? JSON.stringify(opt.body) : undefined
        });
        let js = null;
        try { js = await res.json(); } catch (e) {}
        if (!res.ok || !js || js.error) throw new Error((js && js.error) || `Server error (${res.status})`);
        return js;
      }
      return {
        name: "rest",
        async init() {
          if (/domain-anda/.test(REST_API_URL)) throw new Error("Isi REST_API_URL terlebih dahulu.");
        },
        async list(col) {
          const js = await call("list", { method: "GET", query: "&col=" + encodeURIComponent(col) });
          return (js.rows || []).map(fromRow);
        },
        async upsert(col, id, obj) {
          await call("upsert", { body: { col, ...toRow(col, id, obj) } });
        },
        async bulkUpsert(col, items) {
          for (let i = 0; i < items.length; i += 5) {
            await Promise.all(items.slice(i, i + 5).map((d) => call("upsert", { body: { col, ...toRow(col, d.id, d) } })));
          }
        },
        async remove(col, id) {
          await call("remove", { body: { col, id } });
        },
        auth: {
          async signIn(email, password) {
            const js = await call("login", { body: { email, password } });
            token = js.token;
            return { email: js.email || email };
          },
          async signOut() {
            try { await call("logout"); } catch (e) {}
            token = null;
          },
          async changePassword(oldPass, newPass) {
            await call("change_password", { body: { old: oldPass, new: newPass } });
          }
        }
      };
    }

    function toNum(v) {
      if (v === "" || v === null || v === undefined) return null;
      const n = Number(String(v).replace(",", ".").trim());
      return Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : null;
    }

    // Penjaga Input Angka Real-Time (Mencegah Pengetikan Angka > 100 seperti 300)
    window.clampScoreInput = function (el) {
      if (!el || el.value === "") return;
      const maxVal = el.max !== "" && el.max !== undefined ? Number(el.max) : 100;
      const minVal = el.min !== "" && el.min !== undefined ? Number(el.min) : 0;
      const num = Number(String(el.value).replace(",", "."));
      if (!Number.isFinite(num)) return;
      if (num > maxVal) {
        el.value = String(maxVal);
        showToast(`\u26A0\uFE0F Nilai maksimal adalah ${maxVal}! Input otomatis dibatasi ke ${maxVal}.`);
      } else if (num < minVal) {
        el.value = String(minVal);
        showToast(`\u26A0\uFE0F Nilai minimal adalah ${minVal}!`);
      }
    };

    document.addEventListener("input", function (e) {
      const t = e.target;
      if (t && t.tagName === "INPUT" && t.type === "number") {
        window.clampScoreInput(t);
      }
    });

    function avgNumbers(arr) {
      const valid = arr.map(toNum).filter((n) => n !== null);
      if (!valid.length) return null;
      return valid.reduce((a, b) => a + b, 0) / valid.length;
    }

    function fmtScore(n) {
      if (n === null || n === undefined || n === "") return "";
      const num = Number(n);
      if (!Number.isFinite(num)) return "";
      return Number.isInteger(num) ? String(num) : num.toFixed(1);
    }

    function getActiveMapel() {
      if (!STATE.pengaturan_mapel.length) return null;
      let found = STATE.pengaturan_mapel.find((m) => m.id === STATE.selectedMapelId);
      if (!found) {
        found = STATE.pengaturan_mapel[0];
        STATE.selectedMapelId = found.id;
      }
      if (isMapelLocked(found)) {
        const s1 = STATE.pengaturan_mapel.find((x) => x.semester === "Sem 1" && x.kodeKelas === found.kodeKelas && x.namaMapel === found.namaMapel);
        if (s1) {
          found = s1;
          STATE.selectedMapelId = found.id;
        }
      }
      if (!found.jumlahTP || found.jumlahTP < 1) found.jumlahTP = 10;
      if (!found.rewardTiers) {
        found.rewardTiers = JSON.parse(JSON.stringify(DEFAULT_REWARD_TIERS));
      }
      if (!found.kategoriPrestasi || !found.kategoriPrestasi.length) {
        found.kategoriPrestasi = JSON.parse(JSON.stringify(DEFAULT_PRESTASI_CATEGORIES));
      }
      found.kategoriPrestasi.forEach((cat) => {
        if (!cat.medalTiers) {
          const base = Number(cat.defaultNilai || 95);
          cat.medalTiers = {
            emas: Math.min(100, base),
            perak: Math.max(0, base - 3),
            perunggu: Math.max(0, base - 6),
            harapan: Math.max(0, base - 9),
            proses: Math.max(0, base - 12)
          };
        }
      });
      return found;
    }

    function getColumnFilledInfo(mapelCfg, scope, colKey, tpKey, filterNisList) {
      if (!mapelCfg) return { isFilled: false, count: 0 };
      const targetNisSet =
        filterNisList && filterNisList.length
          ? new Set(filterNisList)
          : new Set(
              STATE.murid
                .filter((m) => m.kelas === mapelCfg.kodeKelas && m.status !== "Nonaktif")
                .map((m) => m.nis)
            );

      let filledCount = 0;
      STATE.nilai_asesmen.forEach((rec) => {
        if (rec.idMapelKelas !== mapelCfg.id || !targetNisSet.has(rec.nis)) return;
        let val = "";
        if (scope === "FINAL") {
          val = rec[colKey] ?? "";
        } else {
          val = rec.tpScores?.[tpKey]?.[colKey] ?? "";
        }
        if (val !== "" && val !== null && val !== undefined) {
          filledCount++;
        }
      });

      return { isFilled: filledCount > 0, count: filledCount };
    }

    // Cek apakah suatu TP (misal TP1, TP2, TP3) sudah memiliki nilai siswa
    function doesTPHaveScores(mapelId, tpKey) {
      if (!mapelId || !tpKey) return false;
      const cols = ["f1", "f2", "f3", "f4", "f5", "s1", "r1", "s2", "r2", "remTp"];
      return STATE.nilai_asesmen.some((rec) => {
        if (rec.idMapelKelas !== mapelId) return false;
        const tpObj = rec.tpScores?.[tpKey];
        if (!tpObj) return false;
        return cols.some((c) => tpObj[c] !== "" && tpObj[c] !== null && tpObj[c] !== undefined);
      });
    }

    // Mencari nomor urut TP tertinggi yang sudah memiliki nilai siswa
    function getHighestScoredTPIndex(mapelId) {
      let maxIdx = 0;
      for (let i = 1; i <= 30; i++) {
        if (doesTPHaveScores(mapelId, "TP" + i)) {
          maxIdx = i;
        }
      }
      return maxIdx;
    }

    function getInputtedTPKeys(mapelCfg) {
      if (!mapelCfg) return ["TP1"];
      const totalTP = Number(mapelCfg.jumlahTP || 10);
      const daftar = mapelCfg.daftarTP || {};
      const inputted = [];
      for (let i = 1; i <= totalTP; i++) {
        const k = "TP" + i;
        const hasDesc = daftar[k] && String(daftar[k]).trim() !== "";
        const hasScore = doesTPHaveScores(mapelCfg.id, k);
        if (hasDesc || hasScore) {
          inputted.push(k);
        }
      }
      return inputted.length > 0 ? inputted : ["TP1"];
    }

        mapelUtama: "Mata Pelajaran",
        emailGuru: "",
        waGuru: "",
        fotoBase64: "",
        temaGui: "default"
      };
    }

    function calcRemedialPair(scoreAwal, scoreRem, kktp, policy) {
      const s = toNum(scoreAwal);
      const r = toNum(scoreRem);
      if (s === null && r === null) return null;
      if (r === null) return s;
      if (s === null) return r;
      if (policy === "batas_kktp") {
        return Math.max(s, Math.min(r, Number(kktp || 75)));
      }
      if (policy === "rata_rata") {
        return (s + r) / 2;
      }
      return Math.max(s, r);
    }

    function convertExamScore(rawScore, mapelCfg, allClassRawScores) {
      const x = toNum(rawScore);
      if (x === null) return null;

      const tech = mapelCfg?.teknikKonversi || "interpolasi_linier";
      if (tech === "tanpa_konversi") {
        return x;
      }
      if (tech === "akar_kuadrat") {
        return Math.min(100, Math.sqrt(x) * 10);
      }
      if (tech === "poin_tambahan") {
        const boost = Number(mapelCfg?.konversiBoostPoin ?? 8);
        return Math.min(100, x + boost);
      }

      const minIdeal = Number(mapelCfg?.konversiMinIdeal ?? mapelCfg?.kktp ?? 75);
      const maxIdeal = Number(mapelCfg?.konversiMaxIdeal ?? 95);
      const validScores = (allClassRawScores || []).map(toNum).filter((n) => n !== null);

      const minRaw = validScores.length > 1 ? Math.min(...validScores) : 0;
      const maxRaw = validScores.length > 1 ? Math.max(...validScores) : 100;

      if (maxRaw === minRaw) {
        return Math.max(x, minIdeal);
      }
      const converted = minIdeal + ((x - minRaw) / (maxRaw - minRaw)) * (maxIdeal - minIdeal);
      return Math.max(0, Math.min(100, converted));
    }

    function computeSingleTP(tpObj, mapelCfg) {
      const d = tpObj || {};
      const kktp = Number(mapelCfg?.kktp ?? 75);
      const policy = mapelCfg?.kebijakanRemedial || "nilai_tertinggi";
      const model = mapelCfg?.modelPenilaian || "bobot_kustom";
      const wF = Number(mapelCfg?.bobotDalamTP?.formatif ?? 30);
      const wS = Number(mapelCfg?.bobotDalamTP?.sumatif ?? 70);

      const rataF = avgNumbers([d.f1, d.f2, d.f3, d.f4, d.f5]);
      const final1 = calcRemedialPair(d.s1, d.r1, kktp, policy);
      const final2 = calcRemedialPair(d.s2, d.r2, kktp, policy);
      const rataS = avgNumbers([final1, final2]);

      let nilaiMurniTP = null;
      if (model === "ppa_sumatif") {
        nilaiMurniTP = rataS !== null ? rataS : rataF;
      } else if (model === "rata_rata_murni") {
        nilaiMurniTP = avgNumbers([rataF, rataS]);
      } else {
        if (rataF !== null && rataS !== null) {
          const totalW = wF + wS || 100;
          nilaiMurniTP = (rataF * wF + rataS * wS) / totalW;
        } else if (rataS !== null) {
          nilaiMurniTP = rataS;
        } else if (rataF !== null) {
          nilaiMurniTP = rataF;
        }
      }

      const remTp = toNum(d.remTp);
      const nilaiAkhirTP = remTp !== null ? remTp : nilaiMurniTP;

      return {
        f1: toNum(d.f1),
        f2: toNum(d.f2),
        f3: toNum(d.f3),
        f4: toNum(d.f4),
        f5: toNum(d.f5),
        rataF,
        s1: toNum(d.s1),
        r1: toNum(d.r1),
        final1,
        s2: toNum(d.s2),
        r2: toNum(d.r2),
        final2,
        rataS,
        nilaiMurniTP,
        remTp,
        nilaiAkhirTP
      };
    }

    function computeStudentRow(student, mapelCfg) {
      const rec = STATE.nilai_asesmen.find((n) => n.idMapelKelas === mapelCfg.id && n.nis === student.nis) || {
        tpScores: {},
        ats: "",
        sat: "",
        rem: "",
        remNote: ""
      };

      const classRecords = STATE.nilai_asesmen.filter((n) => n.idMapelKelas === mapelCfg.id);
      const allAtsScores = classRecords.map((r) => r.ats);
      const allSatScores = classRecords.map((r) => r.sat);

      const totalTP = Number(mapelCfg.jumlahTP || 10);
      const inputtedTPKeys = getInputtedTPKeys(mapelCfg);
      const inputtedSet = new Set(inputtedTPKeys);
      const tpComputed = {};
      const activeTPValues = [];
      const missingTasks = [];

      for (let i = 1; i <= totalTP; i++) {
        const key = "TP" + i;
        const c = computeSingleTP(rec.tpScores ? rec.tpScores[key] : {}, mapelCfg);
        tpComputed[key] = c;
        if (inputtedSet.has(key)) {
          if (c.nilaiAkhirTP !== null) activeTPValues.push(c.nilaiAkhirTP);
          const raw = (rec.tpScores && rec.tpScores[key]) || {};
          const kk = Number(mapelCfg.kktp ?? 75);
          const used = (f) => classRecords.some((r) => toNum(r.tpScores && r.tpScores[key] ? r.tpScores[key][f] : null) !== null);
          const before = missingTasks.length;
          if (toNum(raw.remTp) === null) {
            ["f1", "f2", "f3", "f4", "f5"].forEach((f, n) => {
              const v = toNum(raw[f]);
              if (v === null) return;
              if (v === 1) {
                missingTasks.push(`${key} Formatif ${n + 1}: belum mengumpulkan tugas`);
              } else if (v < kk) {
                missingTasks.push(`${key} Formatif ${n + 1}: ${fmtScore(v)} (di bawah KKTP ${kk})`);
              }
            });
            [["s1", "r1", "Sumatif 1"], ["s2", "r2", "Sumatif 2"]].forEach(([s, r, nm]) => {
              const v = toNum(raw[s]);
              const rv = toNum(raw[r]);
              if (v === null) return;
              if (v === 1) {
                if (rv === null || rv === 1) missingTasks.push(`${key} ${nm}: belum ulangan`);
                else if (rv < kk) missingTasks.push(`${key} ${nm}: ulangan susulan ${fmtScore(rv)} masih di bawah KKTP ${kk}`);
              } else if (v < kk) {
                if (rv === null) missingTasks.push(`${key} ${nm}: ${fmtScore(v)} (di bawah KKTP ${kk}), belum remedial`);
                else if (rv < kk) missingTasks.push(`${key} ${nm}: remedial ${fmtScore(rv)} masih di bawah KKTP ${kk}`);
              }
            });
          }
        }
      }

      const rataTP = activeTPValues.length
        ? activeTPValues.reduce((a, b) => a + b, 0) / activeTPValues.length
        : null;

      const ats = toNum(rec.ats);
      const sat = toNum(rec.sat);
      if (ats === null || ats === 1) missingTasks.push("ATS (Tengah Semester) belum diikuti");
      if (sat === null || sat === 1) missingTasks.push("SAT (Akhir Semester) belum diikuti");

      const stsx = convertExamScore(ats, mapelCfg, allAtsScores);
      const sasx = convertExamScore(sat, mapelCfg, allSatScores);

      const model = mapelCfg.modelPenilaian || "bobot_kustom";
      const wHarian = Number(mapelCfg?.bobotRapor?.harianTP ?? 70);
      const wAts = Number(mapelCfg?.bobotRapor?.ats ?? 15);
      const wSat = Number(mapelCfg?.bobotRapor?.sat ?? 15);

      let nilaiAkhir = null;
      if (model === "rata_rata_murni") {
        nilaiAkhir = avgNumbers([rataTP, stsx, sasx]);
      } else {
        let sumWeighted = 0;
        let sumWeightUsed = 0;
        if (rataTP !== null && wHarian > 0) {
          sumWeighted += rataTP * wHarian;
          sumWeightUsed += wHarian;
        }
        if (stsx !== null && wAts > 0) {
          sumWeighted += stsx * wAts;
          sumWeightUsed += wAts;
        }
        if (sasx !== null && wSat > 0) {
          sumWeighted += sasx * wSat;
          sumWeightUsed += wSat;
        }
        if (sumWeightUsed > 0) {
          nilaiAkhir = sumWeighted / sumWeightUsed;
        }
      }

      const rem = toNum(rec.rem);
      let nilaiTPFinal = nilaiAkhir;
      if (rem !== null) {
        nilaiTPFinal = Math.min(100, Math.max(0, rem));
      }

      let predikat = "-";
      if (nilaiTPFinal !== null) {
        const scoreRound = Math.round(nilaiTPFinal);
        const rng = mapelCfg.rentangPredikat || { dMax: 60, cMax: 75, bMax: 85, aMax: 100 };
        if (scoreRound <= Number(rng.dMax ?? 60)) predikat = "D";
        else if (scoreRound <= Number(rng.cMax ?? 75)) predikat = "C";
        else if (scoreRound <= Number(rng.bMax ?? 85)) predikat = "B";
        else predikat = "A";
      }

      return {
        student,
        rec,
        tpComputed,
        rataTP,
        ats,
        stsx,
        sat,
        sasx,
        nilaiAkhir,
        rem,
        remNote: rec.remNote || "",
        nilaiTPFinal,
        predikat,
        missingTasks
      };
    }

    async function loadAllData() {
      if (IS_PREVIEW) return;
      await DB.init();
      const results = await Promise.all(
        COLLECTIONS.map(async (c) => {
          try {
            return [c, await DB.list(c)];
          } catch (err) {
            if (c === "tahun_ajaran" && DB_DRIVER === "firebase") return [c, []];
            throw err;
          }
        })
      );
      results.forEach(([c, rows]) => { STATE[c] = rows; });
      if (STATE.pengaturan_mapel.length && !STATE.selectedMapelId) {
        STATE.selectedMapelId = STATE.pengaturan_mapel[0].id;

    }

    // ===== PENYIMPANAN REAL-TIME KE DATABASE =====
    // Setiap simpan/hapus langsung dikirim ke tabel yang sesuai. Jika koneksi gagal, data
    // masuk antrean (juga disimpan sementara di perangkat) dan dikirim ulang otomatis.
    const syncState = { pending: new Map(), inflight: 0, chain: Promise.resolve(), timer: null, seq: 0 };
    const PENDING_KEY = "bk3_pending_v1";

    function persistPending() {
      try {
        if (!syncState.pending.size) localStorage.removeItem(PENDING_KEY);
        else localStorage.setItem(PENDING_KEY, JSON.stringify([...syncState.pending.values()].map((o) => ({ kind: o.kind, col: o.col, id: o.id, data: o.data }))));
      } catch (e) {}
    }

    function restorePending() {
      try {
        const raw = localStorage.getItem(PENDING_KEY);
        if (!raw) return;
        JSON.parse(raw).forEach((o) => {
          if (o && COLLECTIONS.includes(o.col) && typeof o.id === "string" && (o.kind === "upsert" || o.kind === "remove")) {
            const key = o.col + "|" + o.id;
            if (!syncState.pending.has(key)) syncState.pending.set(key, { ...o, key, seq: ++syncState.seq });
          }
        });
      } catch (e) {}
    }

    function applyPendingToState() {
      syncState.pending.forEach((o) => {
        const list = STATE[o.col] || [];
        const idx = list.findIndex((x) => x.id === o.id);
        if (o.kind === "remove") {
          if (idx >= 0) list.splice(idx, 1);
        } else if (idx >= 0) list[idx] = o.data;
        else list.push(o.data);
        STATE[o.col] = list;
      });
    }

    function renderSyncPill() {
      const pill = document.getElementById("sync-pill");
      const banner = document.getElementById("sync-banner");
      if (!pill) return;
      const n = syncState.pending.size;
      pill.style.display = STATE.user || n ? "" : "none";
      if (IS_PREVIEW) {
        pill.className = "";
        pill.textContent = "Uji coba: tidak disimpan ke database";
      } else if (n && syncState.inflight === 0) {
        pill.className = "err";
        pill.textContent = `\u26A0 ${n} belum tersimpan - ketuk untuk coba lagi`;
      } else if (syncState.inflight > 0 || n) {
        pill.className = "busy";
        pill.textContent = "\u23F3 Menyimpan...";
      } else {
        pill.className = "ok";
        pill.textContent = "\u2601 Tersimpan di database";
      }
      if (banner) {
        const show = !IS_PREVIEW && n > 0 && syncState.inflight === 0;
        banner.style.display = show ? "block" : "none";
        banner.textContent = show ? `Koneksi ke database bermasalah: ${n} data belum tersimpan dan akan dicoba ulang otomatis. Jangan tutup halaman ini.` : "";
      }
    }

    function scheduleRetry() {
      if (syncState.timer) return;
      syncState.timer = setTimeout(() => {
        syncState.timer = null;
        flushPending();
      }, 8000);
    }

    function runOp(op) {
      syncState.chain = syncState.chain.then(async () => {
        if (syncState.pending.get(op.key) !== op) return true;
        syncState.inflight++;
        renderSyncPill();
        try {
          await DB.init();
          if (op.kind === "upsert") await DB.upsert(op.col, op.id, op.data);
          else await DB.remove(op.col, op.id);
          if (syncState.pending.get(op.key) === op) syncState.pending.delete(op.key);
          persistPending();
          return true;
        } catch (err) {
          scheduleRetry();
          return false;
        } finally {
          syncState.inflight--;
          renderSyncPill();
        }
      });
      return syncState.chain;
    }

    function enqueue(kind, col, id, data) {
      const op = { kind, col, id, data, key: col + "|" + id, seq: ++syncState.seq };
      syncState.pending.set(op.key, op);
      persistPending();
      renderSyncPill();
      return runOp(op);
    }

    async function flushPending() {
      if (IS_PREVIEW) return true;
      for (const op of [...syncState.pending.values()]) await runOp(op);
      return syncState.pending.size === 0;
    }

    async function saveDocument(colName, docId, payload) {
      const full = { ...payload, id: docId };
      const list = STATE[colName] || [];
      const idx = list.findIndex((x) => x.id === docId);
      if (idx >= 0) list[idx] = full;
      else list.push(full);
      STATE[colName] = list;
      if (!IS_PREVIEW) await enqueue("upsert", colName, docId, full);
    }

    async function saveDocuments(colName, docs) {
      const fulls = docs.map((d) => ({ ...d }));
      const list = STATE[colName] || [];
      fulls.forEach((full) => {
        const idx = list.findIndex((x) => x.id === full.id);
        if (idx >= 0) list[idx] = full;
        else list.push(full);
      });
      STATE[colName] = list;
      if (IS_PREVIEW || !fulls.length) return;
      const ops = fulls.map((full) => {
        const op = { kind: "upsert", col: colName, id: full.id, data: full, key: colName + "|" + full.id, seq: ++syncState.seq };
        syncState.pending.set(op.key, op);
        return op;
      });
      persistPending();
      syncState.chain = syncState.chain.then(async () => {
        syncState.inflight++;
        renderSyncPill();
        try {
          await DB.init();
          const live = ops.filter((o) => syncState.pending.get(o.key) === o);
          await DB.bulkUpsert(colName, live.map((o) => o.data));
          live.forEach((o) => { if (syncState.pending.get(o.key) === o) syncState.pending.delete(o.key); });
          persistPending();
        } catch (err) {
          scheduleRetry();
        } finally {
          syncState.inflight--;
          renderSyncPill();
        }
      });
      await syncState.chain;
    }

    async function deleteDocument(colName, docId) {
      STATE[colName] = (STATE[colName] || []).filter((x) => x.id !== docId);
      if (!IS_PREVIEW) await enqueue("remove", colName, docId, null);
    }

    function isSubset(a, b) {
      if (a === undefined) return true;
      if (a === null) return b === null || b === undefined;
      if (typeof a !== "object") return a === b || (typeof a === "number" && typeof b === "number" && Math.abs(a - b) < 1e-9);
      if (typeof b !== "object" || b === null) return false;
      if (Array.isArray(a)) return Array.isArray(b) && a.length === b.length && a.every((x, i) => isSubset(x, b[i]));
      return Object.keys(a).every((k) => isSubset(a[k], b[k]));
    }

    // Penguat: pastikan SEMUA data di layar sama dengan isi database; yang berbeda dikirim ulang.
    async function verifySync() {
      if (IS_PREVIEW) return { ok: true, preview: true, checked: 0, repaired: 0 };
      try {
        if (!(await flushPending())) return { ok: false, why: `${syncState.pending.size} data belum berhasil dikirim ke database.` };
        await DB.init();
        let checked = 0, repaired = 0;
        const bad = [];
        for (const col of COLLECTIONS) {
          const remote = new Map((await DB.list(col)).map((d) => [d.id, d]));
          for (const d of STATE[col] || []) {
            checked++;
            const r = remote.get(d.id);
            if (!r || !isSubset(d, r)) {
              try {
                await DB.upsert(col, d.id, d);
                repaired++;
              } catch (e) {
                bad.push(col + "/" + d.id);
              }
            }
          }
        }
        return bad.length ? { ok: false, why: `${bad.length} data gagal dikirim ke database.`, checked, repaired } : { ok: true, checked, repaired };
      } catch (err) {
        return { ok: false, why: "Tidak bisa menghubungi database (" + (err.message || err) + ")." };
      }
    }

        ["murid", "\u{1F9D1}\u200D\u{1F393}", "Data Murid", "Impor Excel", "#16a34a,#4ade80"],

        ["backup_ta", "\u{1F5D3}\uFE0F", "Tahun Ajaran", "Semester & backup", "#475569,#94a3b8"],
        ["profil", "\u{1F464}", "Profil & Sandi", "Identitas guru", "#be123c,#fb7185"],
        ["akses", "\u{1F3A8}", "Panduan & Tema", "Tampilan GUI", "#0d9488,#2dd4bf"]
      ]
        .map(([id, ic, t, d, c]) => `<button type="button" class="dash-tile" style="--g:linear-gradient(135deg,${c})" onclick="window.navigateMenu(${jsArg(id)})"><span class="ic">${ic}</span><b>${t}</b><small>${d}</small></button>`)
        .join("");

      const illus = `<svg viewBox="0 0 160 110" aria-hidden="true"><rect x="8" y="64" width="22" height="40" rx="4" fill="#fff" opacity=".35"/><rect x="38" y="44" width="22" height="60" rx="4" fill="#fff" opacity=".55"/><rect x="68" y="26" width="22" height="78" rx="4" fill="#fff" opacity=".8"/><rect x="98" y="52" width="22" height="52" rx="4" fill="#fff" opacity=".55"/><path d="M10 52 L50 34 L82 18 L128 40" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="128" cy="40" r="6" fill="#fff"/><rect x="128" y="70" width="26" height="34" rx="3" fill="#fff" opacity=".9"/><rect x="132" y="76" width="18" height="3" fill="#0ea5e9"/><rect x="132" y="83" width="14" height="3" fill="#0ea5e9"/></svg>`;
      const hero = `<div class="dash-hero"><div><h2>${sapa}, ${esc((prof.namaGuru || "Bapak/Ibu Guru").split(",")[0])}</h2><p>${esc(tgl)}${prof.namaSekolah ? " \u2022 " + esc(prof.namaSekolah) : ""}${(() => { const t = getCurrentTA(); if (!t) return ""; const sm = t.sem2 === "aktif" ? "Semester 2 aktif" : t.sem1 === "aktif" ? "Semester 1 aktif" : t.sem2 === "selesai" ? "semua semester selesai" : "semester belum diaktifkan"; return " \u2022 TA " + esc(t.nama) + " \u2014 " + sm; })()}</p></div>${illus}</div>`;

      if (!mapel) {
        return `${hero}<div class="card" style="margin-bottom:14px"><p style="margin-bottom:10px">Belum ada kelas dan mata pelajaran.</p><button class="btn btn-primary" onclick="window.navigateMenu('tp_mapel')">+ Buat Kelas & Mapel</button></div><div class="dash-tiles">${tiles}</div>`;
      }

      const kktp = Number(mapel.kktp ?? 75);
      const students = STATE.murid.filter((m) => m.kelas === mapel.kodeKelas && m.status !== "Nonaktif");
      const rows = students.map((st) => ({ st, c: computeStudentRow(st, mapel) }));
      const vals = rows.map((r) => r.c.nilaiTPFinal).filter((v) => v !== null && v !== undefined);
      const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
      const tuntas = vals.filter((v) => v >= kktp).length;
      const butuh = rows.filter((r) => r.c.missingTasks.length).length;
      const dist = { A: 0, B: 0, C: 0, D: 0 };
      rows.forEach((r) => { if (dist[r.c.predikat] !== undefined) dist[r.c.predikat]++; });
      const cols = { A: "#16a34a", B: "#2563eb", C: "#f59e0b", D: "#dc2626" };
      const tot = dist.A + dist.B + dist.C + dist.D;
      const R = 42, CI = 2 * Math.PI * R;
      let off = 0;
      const arcs = tot
        ? Object.keys(dist).map((k) => {
            const len = (dist[k] / tot) * CI;
            const el = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${cols[k]}" stroke-width="16" stroke-dasharray="${len} ${CI - len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
            off += len;
            return el;
          }).join("")
        : `<circle cx="60" cy="60" r="${R}" fill="none" stroke="#e2e8f0" stroke-width="16"/>`;

      const tpKeys = getInputtedTPKeys(mapel);
      const tpAvg = tpKeys.map((k) => {
        const v = rows.map((r) => r.c.tpComputed[k] && r.c.tpComputed[k].nilaiAkhirTP).filter((x) => x !== null && x !== undefined);
        return { k, v: v.length ? v.reduce((a, b) => a + b, 0) / v.length : null };
      });
      const n = tpAvg.length || 1;
      const step = 310 / n;
      const bw = Math.max(8, Math.min(34, step - 6));
      const bars = tpAvg.map((t, i) => {
        const hh = t.v === null ? 0 : (Math.min(100, t.v) / 100) * 110;
        const x = 28 + i * step;
        const fill = t.v !== null && t.v < kktp ? "#f59e0b" : "var(--primary)";
        return `<rect x="${x}" y="${130 - hh}" width="${bw}" height="${hh}" rx="4" style="fill:${fill}"/><text x="${x + bw / 2}" y="144" text-anchor="middle" font-size="9" fill="currentColor">${esc(t.k.replace("TP", ""))}</text>${t.v !== null ? `<text x="${x + bw / 2}" y="${126 - hh}" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor">${Math.round(t.v)}</text>` : ""}`;
      }).join("");
      const ky = 130 - (kktp / 100) * 110;
      const top = rows
        .filter((r) => r.c.nilaiTPFinal !== null && r.c.nilaiTPFinal !== undefined)
        .sort((a, b) => b.c.nilaiTPFinal - a.c.nilaiTPFinal)
        .slice(0, 5)
        .map((r, i) => `<div class="dash-rank"><span>${i + 1}</span><span class="nm">${esc(r.st.nama)}</span><span class="bar"><i style="width:${Math.round(r.c.nilaiTPFinal)}%"></i></span><b>${Math.round(r.c.nilaiTPFinal)}</b></div>`)
        .join("") || `<small style="color:var(--text-secondary)">Belum ada nilai.</small>`;

      const kpi = (l, v, sfx) => `<div class="dash-kpi"><small>${l}</small><b>${v}</b><span>${sfx || ""}</span></div>`;
      return `
        ${hero}
        ${renderCleanWorkspaceBar(mapel, "")}
        <div class="dash-kpis">
          ${kpi("Jumlah Siswa", students.length, "siswa")}
          ${kpi("Rata-rata Rapor", avg !== null ? Math.round(avg) : "-", "")}
          ${kpi("Tuntas KKTP", tuntas, "dari " + vals.length)}
          ${kpi("Perlu Tindak Lanjut", butuh, "siswa")}
        </div>
        <div class="dash-grid">
          <div class="dash-card"><h4>Sebaran Predikat</h4>
            <svg viewBox="0 0 120 120" style="max-width:170px;display:block;margin:0 auto">${arcs}<text x="60" y="58" text-anchor="middle" font-size="20" font-weight="800" fill="currentColor">${avg !== null ? Math.round(avg) : "-"}</text><text x="60" y="73" text-anchor="middle" font-size="8" fill="currentColor">rata-rata</text></svg>
            <div class="dash-legend">${Object.keys(dist).map((k) => `<span><i style="background:${cols[k]}"></i>${k}: ${dist[k]}</span>`).join("")}</div>
          </div>
          <div class="dash-card"><h4>Rata-rata Nilai per TP</h4>
            <svg viewBox="0 0 350 150"><line x1="24" y1="130" x2="346" y2="130" stroke="currentColor" opacity=".3"/><line x1="24" y1="${ky}" x2="346" y2="${ky}" stroke="#dc2626" stroke-dasharray="4 3"/><text x="346" y="${ky - 3}" text-anchor="end" font-size="8" fill="#dc2626">KKTP ${kktp}</text>${bars}</svg>
          </div>
          <div class="dash-card"><h4>5 Nilai Tertinggi</h4>${top}</div>
        </div>
        <div class="dash-tiles">${tiles}</div>
      `;
    }

    window.handleChangePassword = async function (e) {
      e.preventDefault();
      const f = e.target;
      const oldP = f.oldPass.value;
      const newP = f.newPass.value;
      const conf = f.confPass.value;
      if (newP.length < 6) return showToast("Kata sandi baru minimal 6 karakter.");
      if (newP !== conf) return showToast("Konfirmasi kata sandi tidak sama.");
      if (newP === oldP) return showToast("Kata sandi baru harus berbeda dari yang lama.");
      try {
        if (IS_PREVIEW) {
          if (oldP !== demoPassword) throw new Error("Kata sandi lama salah.");
          demoPassword = newP;
        } else {
          await DB.init();
          await DB.auth.changePassword(oldP, newP);
        }
        f.reset();
        showToast("Kata sandi berhasil diganti.");
      } catch (err) {
        const wrong = err && (err.code === "auth/wrong-password" || err.code === "auth/invalid-credential");
        showToast("Gagal mengganti kata sandi: " + (wrong ? "kata sandi lama salah." : err.message || err));
      }
    };

    window.handleLoginSubmit = async function (e) {
      e.preventDefault();
      const form = e.target;
      const idVal = form.identitas.value.trim();
      const passVal = form.password.value;

      if (!idVal || !passVal) {
        return showToast("Harap isi email dan kata sandi.");
      }
      if (loginGuard.lockUntil > Date.now()) {
        return showToast(`Terlalu banyak percobaan. Coba lagi dalam ${Math.ceil((loginGuard.lockUntil - Date.now()) / 1000)} detik.`);
      }

      try {
        if (IS_PREVIEW) {
          if (idVal.toLowerCase() === "guru@sekolah.sch.id" && passVal === demoPassword) {
            STATE.user = {
              identitas: idVal,
              nama: getTeacherProfile().namaGuru,
              role: "Admin",
              aksesKelas: "Semua"
            };
            showToast("Berhasil masuk sebagai Guru Mata Pelajaran.");
            renderApp();
            return;
          }
          throw new Error("Kredensial Demo Guru Mapel: guru@sekolah.sch.id / admin123");
        }

        await DB.init();
        const cred = await DB.auth.signIn(idVal, passVal);
        restorePending();
        await flushPending();
        await loadAllData();
        applyPendingToState();
        STATE.user = {
          identitas: cred.email,
          nama: getTeacherProfile().namaGuru || cred.email,
          role: "Admin",
          aksesKelas: "Semua"
        };
        loginGuard.fails = 0;
        showToast("Login berhasil!");
        renderApp();
      } catch (err) {
        loginGuard.fails++;
        if (loginGuard.fails >= 5) {
          loginGuard.fails = 0;
          loginGuard.lockUntil = Date.now() + 60000;
        }
        showToast("Gagal masuk: " + (err.message || err));
      }
    };

      const students = STATE.murid.filter((m) => m.kelas === mapel.kodeKelas && m.status !== "Nonaktif");
      let updatedCount = 0;

      for (const st of students) {

          await saveDocument("nilai_asesmen", docId, clone);

      if (updatedCount === 0) {
        showToast("Seluruh siswa yang memiliki Nilai Akhir sudah mencapai KKTP.");

    window.handleExcelColumnPaste = function (e, startIndex) {
      const text = (e.clipboardData || window.clipboardData).getData("text");
      if (!text || (!text.includes("\n") && !text.includes("\t"))) return;
      e.preventDefault();
      const rows = text
        .replace(/\r/g, "")
        .split("\n")
        .map((r) => r.split("\t")[0].trim())
        .filter((r) => r !== "");

      const inputs = document.querySelectorAll(".score-row-input");
      let applied = 0;
      let skippedLocked = 0;
      rows.forEach((val, offset) => {
        const target = inputs[startIndex + offset];
        if (target) {
          if (target.disabled || target.type === "hidden") {
            skippedLocked++;
          } else {
            const n = toNum(val);
            target.value = n !== null ? n : "";
            applied++;
          }
        }
      });
      showToast(
        `Menempelkan ${applied} nilai baru.${skippedLocked > 0 ? ` (${skippedLocked} baris yang sudah ada nilainya dilewati agar tidak tertimpa)` : ""}`
      );
    };

    window.applyBulkPasteTextarea = function () {
      const raw = document.getElementById("bulk-paste-area")?.value || "";
      if (!raw.trim()) return showToast("Tempelkan daftar nilai dari Excel terlebih dahulu.");
      const lines = raw.replace(/\r/g, "").split("\n").map((s) => s.trim());
      const inputs = document.querySelectorAll(".score-row-input");
      let count = 0;
      let skipped = 0;
      lines.forEach((val, idx) => {
        if (inputs[idx] && val !== "") {
          if (inputs[idx].disabled || inputs[idx].type === "hidden") {
            skipped++;
          } else {
            const n = toNum(val);
            inputs[idx].value = n !== null ? n : "";
            count++;
          }
        }
      });
      showToast(
        `${count} baris kosong berhasil diisi.${skipped > 0 ? ` (${skipped} baris yang sudah bernilai dilindungi/tidak ditimpa)` : ""}`
      );
    };

      const toSave = [];
      for (const inp of inputs) {
        if (inp.disabled || inp.type === "hidden") continue;

        const docId = `${mapel.id}_${nis}`;

            id: docId,

            nis,
            tpScores: {},
            ats: "",
            sat: "",
            rem: "",
            remNote: ""

        const clone = JSON.parse(JSON.stringify(existing));
        clone.tpScores = clone.tpScores || {};

        if (STATE.selectedColScope === "FINAL") {
          clone[STATE.selectedColKey] = val === null ? "" : val;

          const tpK = STATE.selectedTPKey;

          };

        toSave.push(clone);

    async function applyGroupScoreToStudents(grp, tpKey, colKey) {
      const mapel = getActiveMapel();
      if (!mapel || !grp) return;

      let savedCount = 0;
      let skippedLocked = 0;

      for (const nis of grp.anggotaNis || []) {
        const adj = grp.memberAdjustments?.[nis] || { bonusProaktif: 0, nilaiKhusus: "" };
        let finalMemberScore = grp.nilaiDasarKelompok;
        if (adj.nilaiKhusus !== "" && toNum(adj.nilaiKhusus) !== null) {
          finalMemberScore = toNum(adj.nilaiKhusus);
        } else {
          finalMemberScore = Math.min(100, Math.max(0, Math.round((grp.nilaiDasarKelompok + Number(adj.bonusProaktif || 0)) * 10) / 10));
        }

        const docId = `${mapel.id}_${nis}`;
        let existing = STATE.nilai_asesmen.find((x) => x.id === docId);
        if (!existing) {
          existing = { id: docId, idMapelKelas: mapel.id, nis, tpScores: {}, ats: "", sat: "", rem: "", remNote: "" };
        }

        const existingScore = existing.tpScores?.[tpKey]?.[colKey];
        if (existingScore !== "" && existingScore !== null && existingScore !== undefined) {
          skippedLocked++;
          continue;
        }

        const clone = JSON.parse(JSON.stringify(existing));
        clone.tpScores = clone.tpScores || {};
        clone.tpScores[tpKey] = clone.tpScores[tpKey] || {
          f1: "", f2: "", f3: "", f4: "", f5: "", s1: "", r1: "", s2: "", r2: "", remTp: ""
        };
        clone.tpScores[tpKey][colKey] = finalMemberScore;
        await saveDocument("nilai_asesmen", docId, clone);
        savedCount++;
      }

      if (skippedLocked > 0 && savedCount === 0) {
        showToast(`Gagal menyalurkan: Seluruh anggota (${skippedLocked} siswa) sudah memiliki nilai di ${tpKey} - ${colKey.toUpperCase()}.`);
      } else if (skippedLocked > 0) {
        showToast(`Nilai disalurkan ke ${savedCount} siswa (${skippedLocked} siswa bernilai dilindungi).`);
      } else {
        showToast(`Nilai ${grp.namaKelompok} berhasil dimasukkan ke ${tpKey} (${colKey.toUpperCase()}).`);
      }
    }

    window.exportBackupSQL = function () {
      const sqlEscape = (val) => {
        if (val === null || val === undefined) return "NULL";
        return "'" + String(val).replace(/\\/g, "\\\\").replace(/'/g, "''").replace(/\n/g, "\\n") + "'";
      };

      const nowStr = new Date().toISOString();
      const lines = [
        `-- ============================================================================`,
        `-- BACKUP DATABASE BLOKKOD3 ASSESMENT`,
        `-- Waktu Backup : ${nowStr}`,
        `-- Guru Mapel   : ${getTeacherProfile().namaGuru}`,
        `-- ============================================================================`,
        ``,
        `CREATE TABLE IF NOT EXISTS pengaturan_mapel (id VARCHAR(120) PRIMARY KEY, semester VARCHAR(20), kode_kelas VARCHAR(30), nama_mapel VARCHAR(100), kktp INT, json_config MEDIUMTEXT);`,
        `CREATE TABLE IF NOT EXISTS murid (id VARCHAR(80) PRIMARY KEY, nis VARCHAR(40), nama VARCHAR(120), kelas VARCHAR(30), jk VARCHAR(5), no_hp VARCHAR(30), email VARCHAR(120));`,
        `CREATE TABLE IF NOT EXISTS nilai_asesmen (id VARCHAR(150) PRIMARY KEY, id_mapel_kelas VARCHAR(120), nis VARCHAR(40), ats VARCHAR(10), sat VARCHAR(10), rem VARCHAR(10), rem_note VARCHAR(255), tp_scores_json MEDIUMTEXT);`,
        `CREATE TABLE IF NOT EXISTS kelompok_belajar (id VARCHAR(80) PRIMARY KEY, id_mapel_kelas VARCHAR(120), nama_kelompok VARCHAR(120), nilai_dasar VARCHAR(10), detail_json MEDIUMTEXT);`,
        `CREATE TABLE IF NOT EXISTS reward_siswa (id VARCHAR(80) PRIMARY KEY, id_mapel_kelas VARCHAR(120), nis VARCHAR(40), nama_murid VARCHAR(120), penghargaan VARCHAR(255), nilai_tembak VARCHAR(10));`,
        ``
      ];

      STATE.pengaturan_mapel.forEach((m) => {
        lines.push(
          `REPLACE INTO pengaturan_mapel VALUES (${sqlEscape(m.id)}, ${sqlEscape(m.semester)}, ${sqlEscape(m.kodeKelas)}, ${sqlEscape(m.namaMapel)}, ${Number(m.kktp || 75)}, ${sqlEscape(JSON.stringify(m))});`
        );
      });

      STATE.murid.forEach((s) => {
        lines.push(
          `REPLACE INTO murid VALUES (${sqlEscape(s.id)}, ${sqlEscape(s.nis)}, ${sqlEscape(s.nama)}, ${sqlEscape(s.kelas)}, ${sqlEscape(s.jenisKelamin)}, ${sqlEscape(s.noHp)}, ${sqlEscape(s.email)});`
        );
      });

      STATE.nilai_asesmen.forEach((n) => {
        lines.push(
          `REPLACE INTO nilai_asesmen VALUES (${sqlEscape(n.id)}, ${sqlEscape(n.idMapelKelas)}, ${sqlEscape(n.nis)}, ${sqlEscape(n.ats)}, ${sqlEscape(n.sat)}, ${sqlEscape(n.rem)}, ${sqlEscape(n.remNote)}, ${sqlEscape(JSON.stringify(n.tpScores || {}))});`
        );
      });

      STATE.kelompok_belajar.forEach((g) => {
        lines.push(
          `REPLACE INTO kelompok_belajar VALUES (${sqlEscape(g.id)}, ${sqlEscape(g.idMapelKelas)}, ${sqlEscape(g.namaKelompok)}, ${sqlEscape(g.nilaiDasarKelompok)}, ${sqlEscape(JSON.stringify(g))});`
        );
      });

      STATE.reward_siswa.forEach((r) => {
        lines.push(
          `REPLACE INTO reward_siswa VALUES (${sqlEscape(r.id)}, ${sqlEscape(r.idMapelKelas)}, ${sqlEscape(r.nis)}, ${sqlEscape(r.namaMurid)}, ${sqlEscape(r.namaPenghargaan)}, ${sqlEscape(r.nilaiTembak)});`
        );
      });

      const blob = new Blob([lines.join("\n")], { type: "application/sql;charset=utf-8" });
      const a = document.createElement("a");
      const dateStr = new Date().toISOString().slice(0, 10);
      a.href = URL.createObjectURL(blob);
      a.download = `Backup_Database_blokkod3_assesment_${dateStr}.sql`;
      document.body.appendChild(a);

    window.handleUploadExcelMurid = function (file) {
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) return showToast("Ukuran file terlalu besar (maks 5 MB).");
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const wb = XLSX.read(e.target.result, { type: "array" });
          const rawRows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
          let count = 0;
          let skipped = 0;
          const docsToSave = [];
          const validKelas = getKelasList();
          for (const r of rawRows.slice(0, 3000)) {
            const nis = String(r.NIS || r.nis || r.NISN || "").trim();
            const nama = String(r.Nama || r.nama || r["Nama Siswa"] || "").trim();
            const kelas = String(r.Kelas || r.kelas || r.Rombel || "").trim();
            const jk = String(r.JenisKelamin || r.JK || r.L_P || "L").trim().toUpperCase().slice(0, 1) || "L";
            const noHp = String(r.NoHP || r.noHp || r.HP || r.WA || "").trim();
            const email = String(r.Email || r.email || "").trim();
            if (!nis || !nama || nis.length > 40 || nama.length > 120 || !validKelas.includes(kelas)) {
              skipped++;
              continue;
            }
            if (nis && nama) {
              docsToSave.push({
                id: `m_${nis}`,
                nis,
                nama,
                kelas,
                jenisKelamin: jk,
                noHp,
                email,
                status: "Aktif"
              });
              count++;
            }
          }
          await saveDocuments("murid", docsToSave);
          showToast(`Berhasil mengimpor ${count} data murid.${skipped ? " " + skipped + " baris dilewati (kelas belum dibuat atau data tidak lengkap)." : ""}`);
          renderApp();
        } catch (err) {
          showToast("Gagal membaca file Excel: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    };

    window.adjustTPCount = async function (delta) {
      const mapel = getActiveMapel();
      if (!mapel) return;
      const current = Number(mapel.jumlahTP || 10);
      if (delta < 0) {
        if (current <= 1) {
          return showToast("Minimal harus terdapat 1 slot Tujuan Pembelajaran.");
        }
        const highestScoredIdx = getHighestScoredTPIndex(mapel.id);
        if (current <= highestScoredIdx || doesTPHaveScores(mapel.id, "TP" + current)) {
          return showToast(
            `\u{1F512} Tidak dapat mengurangi slot! TP${current} sudah memiliki nilai siswa.`
          );
        }
      }
      const next = Math.max(1, Math.min(30, current + delta));
      if (next === current) return;
      mapel.jumlahTP = next;
      mapel.daftarTP = mapel.daftarTP || {};
      for (let i = 1; i <= next; i++) {
        if (mapel.daftarTP["TP" + i] === undefined) {
          mapel.daftarTP["TP" + i] = "";
        }
      }
      await saveDocument("pengaturan_mapel", mapel.id, mapel);
      showToast(`Jumlah slot Tujuan Pembelajaran diatur menjadi ${next} TP.`);
      renderApp();
    };

      const jenisKelamin = f.jenisKelamin.value;

      if (!nis || !nama || !kelas) return showToast("NIS, Nama, dan Kelas wajib diisi.");
      if (nis.length > 40 || nama.length > 120 || noHp.length > 30 || email.length > 120) return showToast("Ada isian yang terlalu panjang.");
      const oldK = STATE.editingMuridId ? (STATE.murid.find((m) => m.id === STATE.editingMuridId) || {}).kelas : null;

      if (STATE.editingMuridId) {
        const oldMurid = STATE.murid.find((m) => m.id === STATE.editingMuridId);
        const oldNis = oldMurid ? oldMurid.nis : "";
        const newDocId = `m_${nis}`;

        if (oldMurid && oldMurid.id !== newDocId) {
          await deleteDocument("murid", oldMurid.id);
        }

        // Sinkronkan NIS & Nama pada data nilai, penghargaan, dan kelompok jika NIS diubah
        if (oldNis && oldNis !== nis) {
          for (const rec of [...STATE.nilai_asesmen]) {
            if (rec.nis === oldNis) {
              const newScoreId = `${rec.idMapelKelas}_${nis}`;
              await deleteDocument("nilai_asesmen", rec.id);
              await saveDocument("nilai_asesmen", newScoreId, { ...rec, id: newScoreId, nis });

          for (const rw of [...STATE.reward_siswa]) {
            if (rw.nis === oldNis) {
              await saveDocument("reward_siswa", rw.id, { ...rw, nis, namaMurid: nama });
            }
          }
        } else {
          for (const rw of [...STATE.reward_siswa]) {
            if (rw.nis === nis && rw.namaMurid !== nama) {
              await saveDocument("reward_siswa", rw.id, { ...rw, namaMurid: nama });
            }
          }
        }

        await saveDocument("murid", newDocId, {
          nis,
          nama,
          kelas,
          jenisKelamin,
          noHp,
          email,
          status: "Aktif"
        });
        STATE.editingMuridId = "";
        f.reset();
        showToast(`Data siswa "${nama}" berhasil diperbarui!`);
        renderApp();
        return;
      }

      await saveDocument("murid", `m_${nis}`, {
        nis,
        nama,
        kelas,
        jenisKelamin,
        noHp,
        email,
        status: "Aktif"

          const canvas = document.createElement("canvas");
          const maxDim = 220;
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const base64 = canvas.toDataURL("image/jpeg", 0.85);

          const prof = getTeacherProfile();
          prof.fotoBase64 = base64;
          await saveDocument("profil_guru", "main_profile", prof);
          showToast("Foto profil guru berhasil diperbarui!");

        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    function renderPerbandinganSemesterView() {
      const mapelSem1 = STATE.pengaturan_mapel.find((m) => m.semester === "Sem 1");
      const mapelSem2 = STATE.pengaturan_mapel.find((m) => m.semester === "Sem 2");

      const combos = [];
      getKelasList().forEach((k) => {
        Array.from(new Set(STATE.pengaturan_mapel.filter((m) => m.kodeKelas === k).map((m) => m.namaMapel))).forEach((mn) =>
          combos.push({ k, mn, key: `${k}__${mn}` })
        );
      });
      const cur = combos.find((c) => c.key === STATE.compareKelasMapelKey) || combos[0] || { k: "", mn: "", key: "" };
      const selectedKelas = cur.k, selectedMapelName = cur.mn, selKey = cur.key;
      const s1 = STATE.pengaturan_mapel.find((m) => m.semester === "Sem 1" && m.kodeKelas === selectedKelas && m.namaMapel === selectedMapelName);
      const s2 = STATE.pengaturan_mapel.find((m) => m.semester === "Sem 2" && m.kodeKelas === selectedKelas && m.namaMapel === selectedMapelName);

      const students = STATE.murid
        .filter((m) => m.kelas === selectedKelas && m.status !== "Nonaktif")
        .sort((a, b) => a.nama.localeCompare(b.nama, "id"));

      const comparisonRows = students.map((st) => {
        const r1 = s1 ? computeStudentRow(st, s1).nilaiTPFinal : null;
        const r2 = s2 ? computeStudentRow(st, s2).nilaiTPFinal : null;
        let diff = null;
        let status = "Stabil";
        if (r1 !== null && r2 !== null) {
          diff = Math.round((r2 - r1) * 10) / 10;
          if (diff > 0) status = "Naik";
          else if (diff < 0) status = "Turun";
        }
        return { st, r1, r2, diff, status };
      });

      return `
        <div class="workspace-bar">
          <div class="workspace-left">
            <span class="workspace-title">\u{1F4CA} Perbandingan Nilai Rapor Semester 1 & 2</span>
          </div>
          <div class="workspace-meta">
            <select class="input" style="width:auto;font-weight:700;padding:5px 10px" onchange="window.setCompareKey(this.value)">
              ${combos.map((c) => `<option value="${esc(c.key)}" ${selKey === c.key ? "selected" : ""}>Kelas ${esc(c.k)} \u2014 ${esc(c.mn)}</option>`).join("")}

        </div>

          </div>

                <tr>
                  <th style="width:50px">No</th>
                  <th>NIS</th>
                  <th style="text-align:left;padding-left:12px">Nama Siswa</th>
                  <th>Nilai Sem 1</th>
                  <th>Nilai Sem 2</th>
                  <th>Selisih (&plusmn;)</th>
                  <th>Status Perkembangan</th>
                </tr>
              </thead>
              <tbody>
                ${
                  comparisonRows.length
                    ? comparisonRows
                        .map((item, idx) => {
                          const badgeColor =
                            item.status === "Naik" ? "background:#dcfce7;color:#166534" : item.status === "Turun" ? "background:#fee2e2;color:#991b1b" : "background:#f1f5f9;color:#475569";
                          const icon = item.status === "Naik" ? "\u{1F4C8}" : item.status === "Turun" ? "\u{1F4C9}" : "\u2796";
                          return `
                            <tr>
                              <td>${idx + 1}</td>
                              <td><b>${esc(item.st.nis)}</b></td>
                              <td style="text-align:left;padding-left:12px;font-weight:600">${esc(item.st.nama)}</td>
                              <td>${item.r1 !== null ? Math.round(item.r1) : "-"}</td>
                              <td>${item.r2 !== null ? Math.round(item.r2) : "-"}</td>
                              <td style="font-weight:700">${item.diff !== null ? (item.diff > 0 ? "+" + item.diff : item.diff) : "-"}</td>
                              <td>
                                <span class="badge" style="${badgeColor}">
                                  ${icon} ${item.status}
                                </span>
                              </td>
                            </tr>
                          `;
                        })
                        .join("")
                    : `<tr><td colspan="7" style="padding:20px">Belum ada data siswa untuk perbandingan.</td></tr>`
                }
              </tbody>
            </table>
          </div>
        </div>
      `;

    window.downloadPerbandinganExcel = function (kelas, mapelName) {
      if (typeof XLSX === "undefined") return;
      const s1 = STATE.pengaturan_mapel.find((m) => m.semester === "Sem 1" && m.kodeKelas === kelas && m.namaMapel === mapelName);
      const s2 = STATE.pengaturan_mapel.find((m) => m.semester === "Sem 2" && m.kodeKelas === kelas && m.namaMapel === mapelName);
      const students = STATE.murid.filter((m) => m.kelas === kelas && m.status !== "Nonaktif");

      const rows = students.map((st, i) => {
        const r1 = s1 ? computeStudentRow(st, s1).nilaiTPFinal : null;
        const r2 = s2 ? computeStudentRow(st, s2).nilaiTPFinal : null;
        let diff = r1 !== null && r2 !== null ? Math.round((r2 - r1) * 10) / 10 : "";
        let status = diff === "" ? "-" : diff > 0 ? "Naik" : diff < 0 ? "Turun" : "Stabil";
        return {
          No: i + 1,
          NIS: st.nis,
          "Nama Siswa": st.nama,
          Kelas: st.kelas,
          "Nilai Sem 1": r1 !== null ? Math.round(r1) : "",
          "Nilai Sem 2": r2 !== null ? Math.round(r2) : "",
          "Selisih Poin": diff,
          "Status": status
        };
      });

      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Perbandingan_Sem1_Sem2");
      XLSX.writeFile(wb, `Perbandingan_Semester_${kelas}_${mapelName}.xlsx`.replace(/\s+/g, "_"));
      showToast("File Excel Perbandingan berhasil diunduh!");
    };

                      const hasExistingScore = curVal !== "" && curVal !== null && curVal !== undefined;
